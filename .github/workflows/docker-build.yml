name: Build and Push Docker Image

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: gitlab.catalink.eu:5050
  IMAGE_PREFIX: gitlab.catalink.eu:5050/external/alfie_eu/alfie

jobs:
  build-push:
    name: Build and Push ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: automl_engine
            context: .
            dockerfile: Dockerfile

    steps:
      - uses: actions/checkout@v4 # v4
        with:
          fetch-depth: 1

      - name: Log in to GitLab Container Registry
        run: echo ${{ secrets.DOCKER_PASSWORD_CATALINK }} | docker login gitlab.catalink.eu:5050 -u ${{ secrets.DOCKER_USERNAME_CATALINK }} --password-stdin

      - name: Extract version
        id: version
        run: echo "tag=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
