[project]
name = "alfie-automl-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "autogluon>=1.3,<2",
  "bs4>=0.0.2,<1",
  "fastapi>=0.116,<1",
  "huggingface-hub>=0.33,<1",
  "jinja2>=3.1,<4",
  "lightning>=2.5,<3",
  "nest-asyncio>=1.6,<2",
  "onnx>=1.19,<2",
  "pandas>=2.2,<3",
  "pillow>=11.2,<12",
  "pydantic>=2.11,<3",
  "python-multipart>=0.0.9,<1",
  "python-docx>=1.2,<2",
  "requests>=2.32,<3",
  "scikit-learn>=1.6,<2",
  "streamlit>=1.45,<2",
  "textblob>=0.18,<1",
  "textstat>=0.7,<1",
  "timm>=1.0,<2",
  "torch>=2.6,<3",
  "torchvision>=0.21,<1",
  "tqdm>=4.67,<5",
  "transformers>=4.49,<5",
  "urllib3>=2.4,<3",
  "uvicorn>=0.35,<1",
  "peft>=0.17,<1",
  "openpyxl>=3.1,<4",
  "python-dotenv>=1.1,<2",
  "openai>=2.2,<3",
  "azure-ai-inference>=1.0.0b9,<2",
  "json5>=0.12,<1",
  "flask>=3.1,<4",
  "structlog>=24.1,<25",
  "pydantic-settings>=2.0,<3",
]

[dependency-groups]
dev = [
  "black>=25.1,<26",
  "isort>=6.0,<7",
  "ruff>=0.12,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pre-commit>=4.5,<5",
  "jupyter>=1.1,<2",
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.6,<10",
  "mkdocstrings>=0.30,<1",
  "mkdocstrings[python]>=0.30,<1",
  "mkdocs-awesome-pages-plugin>=2.10,<3",
  "mypy>=2.1.0",
  "types-requests>=2.33.0.20260518",
  "pytest-cov>=7.1.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# E4/E7/E9 = pycodestyle subset, F = pyflakes (the default set, now explicit).
select = ["E4", "E7", "E9", "F"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.pyright]
include = ["app", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
