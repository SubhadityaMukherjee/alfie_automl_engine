repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  # mypy runs through the project's uv venv (`uv run mypy`) so it sees all
  # installed deps; the [tool.mypy] config in pyproject.toml applies.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (app)
        entry: uv run mypy app/
        language: system
        types: [python]
        pass_filenames: false
