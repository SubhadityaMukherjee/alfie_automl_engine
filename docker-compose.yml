services:
  automl_engine:
    build:
      context: .
      dockerfile: app/Dockerfile
    image: ${GITLAB_REGISTRY}/automl_engine:latest
    container_name: alfie_automl_engine
    command: bash -lc "uv run --no-sync uvicorn app.main:app --reload --host 0.0.0.0 --port ${AUTOML_ENGINE_PORT}"
    ports:
      - "${AUTOML_ENGINE_PORT}:${AUTOML_ENGINE_PORT}"
    env_file: ".env"
    volumes:
      - automl_engine_data:/data
    environment:
      - "AUTODW_URL=${AUTODW_URL-http://host.docker.internal:8000}"
      - "HEALTHCHECK_PORT=${AUTOML_ENGINE_PORT}"
    extra_hosts:
      - "host.docker.internal=host-gateway"
    restart: always

volumes:
  automl_engine_data:
