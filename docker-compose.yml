services:
  automlplus:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: alfie_automlplus
    command: bash -lc "uv run --no-sync uvicorn app.automlplus.main:app --reload --host 0.0.0.0 --port ${AUTOML_PLUS_PORT}"
    ports:
      - "${AUTOML_PLUS_PORT}:${AUTOML_PLUS_PORT}"
    env_file: ".env"
    volumes:
      - automlplus_data:/data
    restart: always

  tabular:
    image: ${GITLAB_REGISTRY}/automl_engine:latest
    container_name: alfie_automl_tabular
    command: bash -lc "uv run --no-sync uvicorn app.tabular_automl.main:app --reload --host 0.0.0.0 --port ${TABULAR_AUTOML_PORT}"
    ports:
      - "${TABULAR_AUTOML_PORT}:${TABULAR_AUTOML_PORT}"
    env_file: ".env"
    volumes:
      - tabular_data:/data
    environment:
      - "AUTODW_URL=${AUTODW_URL-http://host.docker.internal:8000}"
    extra_hosts:
      - "host.docker.internal=host-gateway"
    restart: always

  vision:
    image: ${GITLAB_REGISTRY}/automl_engine:latest
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: alfie_automl_vision
    command: bash -lc "uv run --no-sync uvicorn app.vision_automl.main:app --reload --host 0.0.0.0 --port ${VISION_AUTOML_PORT}"
    ports:
      - "${VISION_AUTOML_PORT}:${VISION_AUTOML_PORT}"
    env_file: ".env"
    volumes:
      - vision_data:/data
    restart: always

volumes:
  vision_data:
  tabular_data:
  automlplus_data:
